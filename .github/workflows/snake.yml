name: Contribution Snake

on:
  schedule:
    - cron: '0 7 * * *' # Daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-contribution-snake:
    name: Update contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install snapkit

      - name: Generate contribution snake
        run: |
          python -c "
          from snapkit import Snake
          import datetime
          
          snake = Snake()
          snake.generate()
          snake.save('snake.svg')
          "
          
          # Calculate the date for the snake (last 365 days)
          end_date = datetime.date.today()
          start_date = end_date - datetime.timedelta(days=364)
          
          print(f'Generated contribution snake from {start_date} to {end_date}')
"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md snake.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution snake"
            git push
          fi