<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Terminal: whoami, lead-devops-sre-engineer; stack: aws, gcp, kubernetes, terraform, sre" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="c1"><rect x="24" y="72" width="0" height="26"><animate attributeName="width" from="0" to="300" dur="0.8s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="24" y="132" width="0" height="26"><animate attributeName="width" from="0" to="400" dur="1.2s" begin="2.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="24" y="192" width="0" height="26"><animate attributeName="width" from="0" to="500" dur="1.6s" begin="4.6s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; }
    .p { fill: #3fb950; }
    .t { fill: #c9d1d9; }
    .o { fill: #58a6ff; }
    .m { fill: #8b949e; font-size: 13px; }
  </style>

  <rect width="800" height="280" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 10a10 10 0 0 1 10-10h780a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="400" y="23" text-anchor="middle" class="m">guest@github: ~</text>

  <!-- command 1 -->
  <g clip-path="url(#c1)"><text x="24" y="90"><tspan class="p">$ </tspan><tspan class="t">whoami</tspan></text></g>
  <text x="24" y="114" class="o" opacity="0">lead-devops-sre-engineer<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.4s" fill="freeze"/></text>

  <!-- command 2 -->
  <g clip-path="url(#c2)"><text x="24" y="150"><tspan class="p">$ </tspan><tspan class="t">cat stack.txt</tspan></text></g>
  <text x="24" y="174" class="o" opacity="0">aws | gcp | kubernetes | terraform | sre<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.6s" fill="freeze"/></text>

  <!-- command 3 -->
  <g clip-path="url(#c3)"><text x="24" y="210"><tspan class="p">$ </tspan><tspan class="t">echo $PHILOSOPHY</tspan></text></g>
  <text x="24" y="234" class="o" opacity="0">automate the toil. measure everything. ship calmly.<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="6.4s" fill="freeze"/></text>

  <!-- blinking cursor -->
  <text x="24" y="262" class="p" opacity="0">$ <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="6.8s" fill="freeze"/></text>
  <rect x="42" y="249" width="9" height="16" fill="#c9d1d9" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.8s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
